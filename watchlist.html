<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watchlist - MovieWatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MovieWatch</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="watchlist.html" class="active">Watchlist</a>
            <a href="about.html">About</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>My Watchlist</h2>
            <p>Movies I want to watch and movies I have already seen.</p>
        </section>

        <section>
            <h2>Want to watch</h2>
            <div class="movie-list">
                <div class="movie-block minecraft">
                    <h3>Minecraft Movie</h3>
                </div>

                <div class="movie-block spiderman">
                    <h3>Spider-Man</h3>
                </div>

                <div class="movie-block forrest-gump">
                    <h3>Forrest Gump</h3>
                </div>

                <div class="movie-block titanic">
                    <h3>Titanic</h3>
                </div>
            </div>
        </section>

        <section>
            <h2>Watched</h2>
            <div class="movie-list">
                <div class="movie-block obsession">
                    <h3>Obsession</h3>
                </div>

                <div class="movie-block odyssey">
                    <h3>The Odyssey</h3>
                </div>
            </div>
        </section>
    </main>

<footer>
    <p>MovieWatch 2026</p>
</footer>
</body>
</html>
